<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gabriel Telles · Cacau Show · Pronta entrega</title>
<meta name="description" content="Chocolates Cacau Show à pronta entrega em São José da Lapa. Escolha e peça pelo WhatsApp.">
<meta name="theme-color" content="#2D1610">
<meta property="og:type" content="website">
<meta property="og:title" content="Gabriel Telles · Cacau Show">
<meta property="og:description" content="Pronta entrega em São José da Lapa. Escolha com calma, eu separo para você.">
<meta property="og:image" content="https://gestortig-png.github.io/GABRIELT/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232D1610'/%3E%3Ctext x='32' y='42' font-family='Georgia' font-size='28' fill='%23E0BE6F' text-anchor='middle'%3EGT%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF6F0;--cream2:#F2EAE0;--line:#E8DDD0;--cocoa:#2D1610;--cocoa2:#46241B;
  --gold:#C59B43;--gold2:#E0BE6F;--wa:#128C4A;--muted:rgba(45,22,16,.62);
  --serif:"Playfair Display",Georgia,serif;--sans:"Plus Jakarta Sans",system-ui,sans-serif;
  --shadow:0 8px 26px -12px rgba(45,22,16,.16);--shadow2:0 18px 40px -14px rgba(45,22,16,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(250,246,240,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mono{width:40px;height:40px;border-radius:13px;background:var(--cocoa);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-size:16px;letter-spacing:.04em;border:1px solid rgba(197,155,67,.45);flex:none}
.brand small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-top{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;background:var(--cocoa);color:var(--cream);font-size:12.5px;font-weight:600;flex:none}
.wa-top svg{width:17px;height:17px;color:#5BD48F}

/* hero */
.hero{padding:30px 0 6px;text-align:center}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(30px,7vw,46px);line-height:1.1;margin:10px 0 8px}
.hero p{margin:0 auto;max-width:460px;color:var(--muted);font-size:14.5px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 0;color:var(--gold)}
.orn i{display:block;width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn span{width:6px;height:6px;transform:rotate(45deg);background:var(--gold)}

/* filtros */
.tools{position:sticky;top:64px;z-index:20;background:linear-gradient(var(--cream) 82%,rgba(250,246,240,0));padding:14px 0 10px}
.search{position:relative;max-width:520px;margin:0 auto 12px}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 40px 0 42px;font:inherit;font-size:14px;color:var(--cocoa);outline:none;box-shadow:var(--shadow)}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:14px;top:13px;width:18px;height:18px;color:var(--muted)}
.search button{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;display:none;color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:0 -16px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:rgba(45,22,16,.78);white-space:nowrap;transition:.2s}
.cat[aria-pressed="true"]{background:var(--cocoa);border-color:var(--cocoa);color:var(--cream)}
.cat em{font-style:normal;font-weight:500;opacity:.6;margin-left:4px}

/* secoes e grade */
main{padding-bottom:120px}
.sec h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}
.sec h2 small{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr);gap:20px}}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s;text-align:left;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.stage{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 50% 46%,#fff 50%,#F4ECE1 100%);display:grid;place-items:center;padding:14%}
.stage img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(45,22,16,.16));transition:transform .5s}
.card:hover .stage img{transform:scale(1.05)}
.tag{position:absolute;left:10px;top:10px;padding:4px 9px;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tag.last{background:var(--cocoa);color:var(--gold2)}
.tag.zero{background:#E4F1F8;color:#1E5D82}
.stage,.info{width:100%;text-align:left}
.info{padding:11px 56px 14px 13px;flex:1;display:flex;flex-direction:column;gap:2px}
.info small{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.info b{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.25}
.info .pr{margin-top:auto;padding-top:6px;font-size:13px;font-weight:700}
.add{position:absolute;right:10px;bottom:10px;height:36px;min-width:36px;padding:0 10px;border-radius:999px;background:var(--cocoa);color:var(--cream);display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;box-shadow:0 6px 14px -6px rgba(45,22,16,.5);transition:.15s}
.add:active{transform:scale(.92)}
.add.on{background:var(--wa)}
.add svg{width:16px;height:16px}
.empty{text-align:center;padding:60px 0;color:var(--muted)}

/* barra flutuante */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:35;max-width:440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 12px;border-radius:18px;background:var(--cocoa);color:var(--cream);border:1px solid rgba(197,155,67,.45);box-shadow:0 18px 40px -12px rgba(45,22,16,.55);transform:translateY(140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bar.show{transform:none}
.bar .n{width:34px;height:34px;border-radius:11px;background:var(--gold2);color:var(--cocoa);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.bar .t{flex:1;font-size:13.5px;font-weight:600;text-align:left}
.bar .t small{display:block;font-size:11px;font-weight:500;color:var(--gold2)}
.bar svg{width:20px;height:20px;color:var(--gold2)}

/* modal produto */
.ov{position:fixed;inset:0;z-index:50;background:rgba(32,15,10,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--cream);border-radius:26px 26px 0 0;transform:translateY(40px);transition:transform .4s cubic-bezier(.2,.8,.2,1);position:relative;padding-bottom:env(safe-area-inset-bottom)}
.ov.on .sheet{transform:none}
@media(min-width:720px){.ov{align-items:center}.sheet{border-radius:26px;max-width:880px;display:grid;grid-template-columns:1.05fr 1fr}}
.x{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:var(--shadow)}
.x svg{width:18px;height:18px}
.pstage{position:relative;aspect-ratio:1/1;background:radial-gradient(circle at 50% 46%,#fff 52%,#F1E7DA 100%);display:grid;place-items:center;padding:12%;touch-action:pan-y}
.pstage img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(45,22,16,.22))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:var(--shadow)}
.nav svg{width:18px;height:18px}.nav.p{left:10px}.nav.n{right:10px}
.cnt{position:absolute;left:14px;top:14px;font-size:11px;font-weight:600;color:var(--muted)}
.pbody{padding:20px 22px 24px}
.pbody small{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.pbody h3{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.2;margin:6px 0 4px}
.pbody .tit{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.pbody .d{font-size:14px;line-height:1.65;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chips span{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.chips .z{background:#E4F1F8;border-color:#C9E2EF;color:#1E5D82}
.chips .l{background:var(--cocoa);border-color:var(--cocoa);color:var(--gold2)}
.ppr{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 14px}
.row{display:flex;gap:10px;align-items:stretch}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:#fff}
.qty button{width:42px;height:48px;font-size:18px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-weight:700}
.btn{flex:1;height:50px;border-radius:14px;background:var(--cocoa);color:var(--cream);font-weight:600;font-size:14px;letter-spacing:.02em}
.btn2{width:100%;margin-top:10px;height:46px;border-radius:14px;border:1px solid rgba(18,140,74,.35);background:rgba(18,140,74,.07);color:#0E6B39;font-weight:600;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn2 svg{width:17px;height:17px}
.lim{font-size:11.5px;color:var(--muted);margin:8px 0 0}

/* selecao */
.drawer{width:100%;max-width:460px;height:100%;max-height:100%;margin-left:auto;background:var(--cream);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ov.on .drawer{transform:none}
#ovBag{align-items:stretch;justify-content:flex-end}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);background:#fff}
.dh h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0}
.dh p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.dl{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.it{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}
.it img{width:58px;height:58px;object-fit:contain;flex:none;background:radial-gradient(circle,#fff 55%,#F4ECE1);border-radius:12px;padding:5px}
.it div{flex:1;min-width:0}
.it small{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.it b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
.it .qty button{width:32px;height:34px;font-size:15px}
.df{padding:16px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:10px}
.df input,.df textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:11px 13px;font:inherit;font-size:14px;color:var(--cocoa);outline:none;resize:none}
.df input:focus,.df textarea:focus{border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--cream);font-size:13px;font-weight:600}
.seg input:checked+span{background:var(--cocoa);color:var(--cream);border-color:var(--cocoa)}
.seg input:focus-visible+span{outline:2px solid var(--gold)}
.send{height:52px;border-radius:14px;background:var(--wa);color:#fff;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:9px}
.send svg{width:19px;height:19px}
.tot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tot button{color:#8E1B24;font-weight:600;font-size:12.5px}
.bempty{margin:auto;text-align:center;color:var(--muted);padding:40px 20px}
.bempty b{display:block;font-family:var(--serif);font-size:19px;color:var(--cocoa);margin-bottom:4px}

footer{border-top:1px solid var(--line);padding:22px 0 110px;text-align:center;font-size:12px;color:var(--muted)}
footer b{display:block;font-family:var(--serif);font-size:15px;color:var(--cocoa);font-weight:500;margin-bottom:2px}
.toast{position:fixed;left:50%;top:76px;z-index:60;transform:translate(-50%,-10px);opacity:0;background:var(--cocoa);color:var(--cream);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;border:1px solid rgba(197,155,67,.4);transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="brand">
      <div class="mono" aria-hidden="true">GT</div>
      <div style="min-width:0"><small>Revendedor Cacau Show</small><b id="nomeTopo"></b></div>
    </div>
    <button class="wa-top" id="waTopo" type="button" aria-label="Falar no WhatsApp">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.2-.3-.2-.5-.3Z"/></svg>
      <span>WhatsApp</span>
    </button>
  </div>
</header>

<section class="wrap hero">
  <div class="eyebrow">Pronta entrega · São José da Lapa</div>
  <h1>Escolha com calma.</h1>
  <p>Tudo o que você vê aqui já está separado e pronto para chegar até você.</p>
  <div class="orn" aria-hidden="true"><i></i><span></span><i></i></div>
</section>

<div class="tools">
  <div class="wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <label class="sr" for="busca">Buscar chocolate</label>
      <input id="busca" type="search" placeholder="Buscar sabor: pistache, avelã, zero açúcar…" autocomplete="off">
      <button id="limpa" type="button" aria-label="Limpar busca">✕</button>
    </div>
    <div class="cats" id="cats" role="toolbar" aria-label="Categorias"></div>
  </div>
</div>

<main class="wrap" id="lista"></main>

<footer class="wrap"><b id="nomeRodape"></b>Revendedor Cacau Show · São José da Lapa, MG<br><span id="foneRodape"></span></footer>

<button class="bar" id="bar" type="button" aria-label="Ver minha seleção">
  <span class="n" id="barN">0</span>
  <span class="t">Ver minha seleção<small id="barS">Enviar pedido pelo WhatsApp</small></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<!-- produto -->
<div class="ov" id="ovProd" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pNome">
    <button class="x" id="pFecha" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg></button>
    <div class="pstage" id="pStage">
      <span class="cnt" id="pCnt"></span>
      <img id="pImg" alt="">
      <button class="nav p" id="pAnt" type="button" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="nav n" id="pProx" type="button" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="pbody">
      <small id="pCat"></small>
      <h3 id="pNome"></h3>
      <p class="tit" id="pTit"></p>
      <p class="d" id="pDesc"></p>
      <div class="chips" id="pChips"></div>
      <p class="ppr" id="pPreco" hidden></p>
      <div class="row">
        <div class="qty"><button type="button" id="qMenos" aria-label="Diminuir">−</button><span id="qVal">1</span><button type="button" id="qMais" aria-label="Aumentar">+</button></div>
        <button class="btn" id="pAdd" type="button">Adicionar à seleção</button>
      </div>
      <p class="lim" id="pLim"></p>
      <button class="btn2" id="pPerg" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg>
        Tirar uma dúvida sobre este chocolate
      </button>
    </div>
  </div>
</div>

<!-- selecao -->
<div class="ov" id="ovBag" aria-hidden="true">
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="bTit">
    <div class="dh">
      <div><h3 id="bTit">Minha seleção</h3><p>O pedido é confirmado comigo no WhatsApp.</p></div>
      <button class="x" style="position:static" id="bFecha" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18" stroke-linecap="round"/></svg></button>
    </div>
    <div class="dl" id="bLista"></div>
    <div class="df" id="bRodape">
      <label class="sr" for="cNome">Seu nome</label>
      <input id="cNome" type="text" placeholder="Seu nome" autocomplete="name">
      <div class="seg" role="radiogroup" aria-label="Como receber">
        <label><input type="radio" name="rec" value="Entrega" checked><span>Entrega</span></label>
        <label><input type="radio" name="rec" value="Retirada / combinar"><span>Retirar / combinar</span></label>
      </div>
      <label class="sr" for="cObs">Observações</label>
      <textarea id="cObs" rows="2" placeholder="Setor, endereço, horário ou se é para presente"></textarea>

/* ============ seleção ============ */
function addSel(id, n) {
  const p = byId[id]; const atual = sel[id] || 0;
  const novo = Math.min(p.qtd, atual + n);
  if (novo === atual) { toast('Você já separou todas as unidades disponíveis'); return false; }
  sel[id] = novo; salvar(); renderBar(); renderLista(); return true;
}
function setSel(id, v) {
  const p = byId[id];
  v = Math.max(0, Math.min(p.qtd, v));
  if (v === 0) delete sel[id]; else sel[id] = v;
  salvar(); renderBar(); renderLista(); renderBag();
}
function renderBar() {
  const n = total();
  $('barN').textContent = n;
  $('barS').textContent = n === 1 ? '1 item · enviar pelo WhatsApp' : n + ' itens · enviar pelo WhatsApp';
  $('bar').classList.toggle('show', n > 0);
}
function renderBag() {
  const ids = Object.keys(sel);
  $('bRodape').hidden = !ids.length;
  if (!ids.length) {
    $('bLista').innerHTML = '<div class="bempty"><b>Sua seleção está vazia</b>Toque no + de um chocolate para separar.</div>';
    return;
  }
  $('bLista').innerHTML = ids.map((id) => { const p = byId[id]; return `
    <div class="it"><img src="${p.img}" alt="">
      <div><small>${esc(p.linha)}</small><b>${esc(p.nome)}</b>${CONFIG.mostrarPreco ? `<span style="font-size:12px;color:var(--muted)">${brl(p.preco * sel[id])}</span>` : ''}</div>
      <div class="qty" style="flex:none"><button type="button" data-menos="${id}" aria-label="Diminuir">−</button><span>${sel[id]}</span><button type="button" data-mais="${id}" aria-label="Aumentar">+</button></div>
    </div>`; }).join('');
  const n = total();
  const vt = ids.reduce((a, id) => a + byId[id].preco * sel[id], 0);
  $('bTot').textContent = (n === 1 ? '1 item' : n + ' itens') + (CONFIG.mostrarPreco ? ' · ' + brl(vt) : '');
}
function msgPedido() {
  const nome = $('cNome').value.trim();
  const rec = document.querySelector('input[name="rec"]:checked').value;
  const obs = $('cObs').value.trim();
  const L = [`Olá, ${CONFIG.nome}! Separei estes chocolates no seu catálogo:`, ''];
  let vt = 0;
  for (const id of Object.keys(sel)) {
    const p = byId[id]; vt += p.preco * sel[id];
    L.push(`• ${sel[id]}x ${p.nome} (${p.linha})` + (CONFIG.mostrarPreco ? ` (${brl(p.preco * sel[id])})` : ''));
  }
  if (CONFIG.mostrarPreco) L.push('', `Total: ${brl(vt)}`);
  L.push('');
  if (nome) L.push(`Nome: ${nome}`);
  L.push(`Receber: ${rec}`);
  if (obs) L.push(`Obs.: ${obs}`);
  return L.join('\n');
}

/* ============ modal produto ============ */
function abrir(id) {
  st.idx = st.visiveis.findIndex((p) => p.id === id);
  if (st.idx < 0) return;
  pintar();
  mostrar('ovProd', true);
}
function pintar() {
  const p = st.visiveis[st.idx];
  st.qty = 1;
  $('pImg').src = p.img; $('pImg').alt = p.titulo;
  $('pCnt').textContent = (st.idx + 1) + ' / ' + st.visiveis.length;
  $('pCat').textContent = p.cat;
  $('pNome').textContent = p.nome;
  $('pTit').textContent = p.titulo;
  $('pDesc').textContent = p.desc;
  const ch = [`<span>${esc(p.linha)}</span>`];
  if (p.tags.includes('zero')) ch.push('<span class="z">Zero adição de açúcar e zero lactose</span>');
  if (p.qtd <= CONFIG.ultimasUnidades) ch.push('<span class="l">Últimas unidades</span>');
  else ch.push('<span>Pronta entrega</span>');
  $('pChips').innerHTML = ch.join('');
  $('pPreco').hidden = !CONFIG.mostrarPreco;
  if (CONFIG.mostrarPreco) $('pPreco').textContent = brl(p.preco);
  pintarQty();
}
function pintarQty() {
  const p = st.visiveis[st.idx]; const ja = sel[p.id] || 0; const resta = p.qtd - ja;
  st.qty = Math.max(1, Math.min(st.qty, Math.max(resta, 1)));
  $('qVal').textContent = st.qty;
  $('pAdd').disabled = resta <= 0;
  $('pAdd').textContent = resta <= 0 ? 'Todas as unidades já estão na seleção' : (ja ? `Adicionar (${ja} na seleção)` : 'Adicionar à seleção');
  $('pAdd').style.opacity = resta <= 0 ? '.55' : '';
  $('pLim').textContent = ja ? `Você já separou ${ja}.` : '';
}
function passo(d) {
  if (st.visiveis.length < 2) return;
  st.idx = (st.idx + d + st.visiveis.length) % st.visiveis.length;
  pintar();
}
let ultimoFoco = null;
function mostrar(id, on) {
  const el = $(id);
  if (on) { ultimoFoco = document.activeElement; }
  el.classList.toggle('on', on);
  el.setAttribute('aria-hidden', String(!on));
  document.body.style.overflow = (on || document.querySelector('.ov.on')) ? 'hidden' : '';
  if (on) setTimeout(() => el.querySelector('.x').focus(), 50);
  else if (ultimoFoco) ultimoFoco.focus();
}

/* ============ eventos ============ */
$('cats').addEventListener('click', (e) => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  st.cat = b.dataset.cat; renderCats(); renderLista();
  window.scrollTo({ top: document.querySelector('.tools').offsetTop - 64, behavior: 'smooth' });
});
$('busca').addEventListener('input', (e) => { st.q = e.target.value; $('limpa').style.display = st.q ? 'block' : 'none'; renderLista(); });
$('limpa').addEventListener('click', () => { st.q = ''; $('busca').value = ''; $('limpa').style.display = 'none'; renderLista(); $('busca').focus(); });
$('lista').addEventListener('click', (e) => {
  const a = e.target.closest('[data-add]');
  if (a) { if (addSel(a.dataset.add, 1)) toast(byId[a.dataset.add].nome + ' separado'); return; }
  const o = e.target.closest('[data-abre]'); if (o) abrir(o.dataset.abre);
});
$('pFecha').onclick = () => mostrar('ovProd', false);
$('ovProd').addEventListener('click', (e) => { if (e.target.id === 'ovProd') mostrar('ovProd', false); });
$('pAnt').onclick = () => passo(-1); $('pProx').onclick = () => passo(1);
$('qMenos').onclick = () => { st.qty = Math.max(1, st.qty - 1); pintarQty(); };
$('qMais').onclick = () => { const p = st.visiveis[st.idx]; st.qty = Math.min(p.qtd - (sel[p.id] || 0), st.qty + 1); pintarQty(); };
$('pAdd').onclick = () => { const p = st.visiveis[st.idx]; if (addSel(p.id, st.qty)) { toast(st.qty + 'x ' + p.nome + ' separado'); mostrar('ovProd', false); } };
$('pPerg').onclick = () => { const p = st.visiveis[st.idx]; wa(`Olá, ${CONFIG.nome}! Vi no seu catálogo: ${p.nome} (${p.linha}). Queria saber mais.`); };
let x0 = 0;
$('pStage').addEventListener('touchstart', (e) => { x0 = e.changedTouches[0].clientX; }, { passive: true });
$('pStage').addEventListener('touchend', (e) => { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 45) passo(dx < 0 ? 1 : -1); }, { passive: true });

$('bar').onclick = () => { renderBag(); mostrar('ovBag', true); };
$('bFecha').onclick = () => mostrar('ovBag', false);
$('ovBag').addEventListener('click', (e) => { if (e.target.id === 'ovBag') mostrar('ovBag', false); });
$('bLista').addEventListener('click', (e) => {
  const m = e.target.closest('[data-mais]'); if (m) { const id = m.dataset.mais; if ((sel[id] || 0) >= byId[id].qtd) toast('Essas são todas as unidades disponíveis'); setSel(id, (sel[id] || 0) + 1); return; }
  const n = e.target.closest('[data-menos]'); if (n) setSel(n.dataset.menos, (sel[n.dataset.menos] || 0) - 1);
});
$('bLimpa').onclick = () => { sel = {}; salvar(); renderBar(); renderLista(); renderBag(); };
$('bEnvia').onclick = () => { if (total()) wa(msgPedido()); };
$('waTopo').onclick = () => wa(`Olá, ${CONFIG.nome}! Vim pelo seu catálogo de chocolates.`);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('ovProd').classList.contains('on')) mostrar('ovProd', false); else if ($('ovBag').classList.contains('on')) mostrar('ovBag', false); }
  if ($('ovProd').classList.contains('on')) { if (e.key === 'ArrowLeft') passo(-1); if (e.key === 'ArrowRight') passo(1); }
});

renderCats(); renderLista(); renderBar();
})();
</script>
</body>
</html>
